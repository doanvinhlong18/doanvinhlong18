name: Refresh profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * 1'

permissions: {}

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  dashboard:
    if: github.repository == 'doanvinhlong18/doanvinhlong18'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      HAS_METRICS_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Refresh the public snapshot and artwork
        shell: bash
        run: |
          if ! python3 scripts/refresh_metrics.py; then
            echo "Public source unavailable; keeping the existing snapshot and rebuilding its artwork."
            python3 scripts/build_assets.py
          fi

      - name: Render with native lowlighter Metrics when configured
        id: native
        if: env.HAS_METRICS_TOKEN == 'true'
        continue-on-error: true
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: doanvinhlong18
          filename: github.svg
          output_action: none
          template: classic
          base: repositories, metadata
          repositories: 100
          repositories_forks: no
          repositories_affiliations: owner
          config_timezone: Asia/Bangkok
          config_display: regular
          config_order: base.repositories, isocalendar, languages
          config_animations: no
          config_base64: yes
          config_padding: 18, 24
          use_prebuilt_image: no
          plugins_errors_fatal: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 5
          plugin_languages_other: yes
          plugin_languages_details: percentage
          plugin_languages_ignored: jupyter notebook, html, css, scss, less, jinja, dockerfile, batchfile, handlebars
          extras_css: |
            svg { background: #0d1117; color: #c9d1d9; border-radius: 14px; }
            .items-wrapper { padding: 16px; box-sizing: border-box; }
            section { margin-bottom: 16px; }
            h1, h2, h3 { color: #79b8ff !important; }
            .field svg { fill: #9baec4 !important; }
            .field.language.details small, footer { color: #9baec4 !important; }
            footer { font-size: 10px; padding: 8px 5px; }

      - name: Adopt the native render if it succeeded
        if: steps.native.outcome == 'success'
        continue-on-error: true
        run: python3 scripts/adopt_native_metrics.py /metrics_renders/github.svg

      - name: Verify all profile outputs
        run: python3 scripts/verify_profile.py

      - name: Commit the refreshed dashboard
        shell: bash
        run: |
          git add assets/profile-header.svg assets/profile-header-mobile.svg assets/spacer.svg assets/metrics/github.svg assets/metrics/engineering.svg assets/metrics-data.json
          if git diff --cached --quiet; then
            echo "No dashboard changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh public profile metrics"
          git push
