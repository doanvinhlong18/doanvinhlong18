name: Refresh profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions: {}

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'doanvinhlong18/doanvinhlong18'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - name: Refresh and validate local activity assets
        run: |
          python3 scripts/refresh_activity.py
          python3 scripts/verify_profile.py
      - name: Commit refreshed snapshot
        run: |
          git add assets/activity.svg assets/activity-mobile.svg assets/activity-data.json
          if git diff --cached --quiet; then
            echo "Activity snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh public contribution snapshot"
          git push
