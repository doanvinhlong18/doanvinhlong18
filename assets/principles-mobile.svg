<svg xmlns="http://www.w3.org/2000/svg" width="640" height="550" viewBox="0 0 640 550" role="img" aria-labelledby="title desc">
  <title id="title">An engineering compass</title>
  <desc id="desc">Correctness, measurement, resilience, observability, and simplicity are engineering principles, not claims of project outcomes.</desc>
  <defs></defs>
  <g font-family="Segoe UI, Arial, sans-serif"><rect x="0.5" y="0.5" width="639" height="549" rx="18" fill="#080B14" stroke="#29314B"/><text x="32" y="42" font-size="11" fill="#A78BFA" font-weight="600" letter-spacing="2.5">AN ENGINEERING COMPASS</text><text x="34" y="97" font-size="14" fill="#06B6D4" font-weight="500" font-family="Consolas, monospace">01</text><text x="85" y="97" font-size="25" fill="#E5E7EB" font-weight="600" >Correctness</text><text x="85" y="124" font-size="20" fill="#A7B3C8" font-weight="400" >before optimization.</text><line x1="85" y1="141" x2="600" y2="141" stroke="#202A40" stroke-width="1" /><text x="34" y="186" font-size="14" fill="#06B6D4" font-weight="500" font-family="Consolas, monospace">02</text><text x="85" y="186" font-size="25" fill="#E5E7EB" font-weight="600" >Measurement</text><text x="85" y="213" font-size="20" fill="#A7B3C8" font-weight="400" >before scaling.</text><line x1="85" y1="230" x2="600" y2="230" stroke="#202A40" stroke-width="1" /><text x="34" y="275" font-size="14" fill="#06B6D4" font-weight="500" font-family="Consolas, monospace">03</text><text x="85" y="275" font-size="25" fill="#E5E7EB" font-weight="600" >Resilience</text><text x="85" y="302" font-size="20" fill="#A7B3C8" font-weight="400" >by design.</text><line x1="85" y1="319" x2="600" y2="319" stroke="#202A40" stroke-width="1" /><text x="34" y="364" font-size="14" fill="#06B6D4" font-weight="500" font-family="Consolas, monospace">04</text><text x="85" y="364" font-size="25" fill="#E5E7EB" font-weight="600" >Observability</text><text x="85" y="391" font-size="20" fill="#A7B3C8" font-weight="400" >with purpose.</text><line x1="85" y1="408" x2="600" y2="408" stroke="#202A40" stroke-width="1" /><text x="34" y="453" font-size="14" fill="#06B6D4" font-weight="500" font-family="Consolas, monospace">05</text><text x="85" y="453" font-size="25" fill="#E5E7EB" font-weight="600" >Simplicity</text><text x="85" y="480" font-size="20" fill="#A7B3C8" font-weight="400" >as a default.</text></g>
</svg>
