<title id="title">Engineering focus and working toolkit</title><desc id="desc">Java backend developer with 2+ years of self-reported professional experience in enterprise applications. Project and research topics include distributed systems, data and search, and applied AI. Learning areas: gRPC, Redis, RabbitMQ, performance, Elasticsearch, and entity matching.</desc>
