<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="254" viewBox="0 0 1200 254" role="img" aria-labelledby="title desc">
  <title id="title">An engineering compass</title>
  <desc id="desc">Correctness, measurement, resilience, observability, and simplicity are engineering principles, not claims of project outcomes.</desc>
  <defs></defs>
  <g font-family="Segoe UI, Arial, sans-serif"><rect x="0.5" y="0.5" width="1199" height="253" rx="18" fill="#080B14" stroke="#29314B"/><text x="32" y="42" font-size="11" fill="#A78BFA" font-weight="600" letter-spacing="2.5">AN ENGINEERING COMPASS</text><text x="32" y="94" font-size="13" fill="#06B6D4" font-weight="500" font-family="Consolas, monospace">01</text><line x1="32" y1="116" x2="224" y2="116" stroke="#323B56" stroke-width="1" /><text x="32" y="160" font-size="22" fill="#E5E7EB" font-weight="600" >Correctness</text><text x="32" y="192" font-size="16" fill="#A7B3C8" font-weight="400" >before optimization</text><text x="267" y="94" font-size="13" fill="#06B6D4" font-weight="500" font-family="Consolas, monospace">02</text><line x1="267" y1="116" x2="459" y2="116" stroke="#323B56" stroke-width="1" /><text x="267" y="160" font-size="22" fill="#E5E7EB" font-weight="600" >Measurement</text><text x="267" y="192" font-size="16" fill="#A7B3C8" font-weight="400" >before scaling</text><text x="502" y="94" font-size="13" fill="#06B6D4" font-weight="500" font-family="Consolas, monospace">03</text><line x1="502" y1="116" x2="694" y2="116" stroke="#323B56" stroke-width="1" /><text x="502" y="160" font-size="22" fill="#E5E7EB" font-weight="600" >Resilience</text><text x="502" y="192" font-size="16" fill="#A7B3C8" font-weight="400" >by design</text><text x="737" y="94" font-size="13" fill="#06B6D4" font-weight="500" font-family="Consolas, monospace">04</text><line x1="737" y1="116" x2="929" y2="116" stroke="#323B56" stroke-width="1" /><text x="737" y="160" font-size="22" fill="#E5E7EB" font-weight="600" >Observability</text><text x="737" y="192" font-size="16" fill="#A7B3C8" font-weight="400" >with purpose</text><text x="972" y="94" font-size="13" fill="#06B6D4" font-weight="500" font-family="Consolas, monospace">05</text><line x1="972" y1="116" x2="1164" y2="116" stroke="#323B56" stroke-width="1" /><text x="972" y="160" font-size="22" fill="#E5E7EB" font-weight="600" >Simplicity</text><text x="972" y="192" font-size="16" fill="#A7B3C8" font-weight="400" >as a default</text></g>
</svg>
